services:
  goaccess:
    build:
      context: https://github.com/RedSparr0w/goaccess.git#master
      target: dashboard
    container_name: goaccess
    restart: unless-stopped
    ports:
      - "7880:7880"
    environment:
      TZ: Pacific/Auckland
      LOG_PATH: /opt/log
      LOG_PATTERN: proxy-host-*_access.log*
      SKIP_ARCHIVED_LOGS: "False"
      KEEP_LAST: "90"
      REPORT_CACHE_SECONDS: "30"
      REPORT_MAX_ITEMS: "366"
      REPORT_TIMEOUT: "180"
    volumes:
      - /home/redsparr0w/docker/npm/data/logs:/opt/log:ro
